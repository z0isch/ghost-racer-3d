name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_TAG: 4.7.1-stable
  # Godot's template lookup dir uses dots before "stable", not the hyphenated release tag.
  GODOT_TEMPLATE_DIR: 4.7.1.stable

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}

      - name: Download Godot editor and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

          curl -fL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/

      - name: Write export_presets.cfg
        # Gitignored by design (docs/engine-setup.md) so it stays per-checkout locally;
        # CI recreates the same Web preset the docs say to leave at its defaults.
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          progressive_web_app/ensure_cross_origin_isolation_headers=true
          progressive_web_app/offline_page=""
          progressive_web_app/display=1
          progressive_web_app/orientation=0
          progressive_web_app/icon_144x144=""
          progressive_web_app/icon_180x180=""
          progressive_web_app/icon_512x512=""
          progressive_web_app/background_color=Color(0, 0, 0, 1)
          EOF
          # The heredoc above is indented to match this YAML block scalar, which
          # would otherwise bake literal leading whitespace into every line.
          sed -i 's/^[[:space:]]*//' export_presets.cfg

      - name: Import project and build script class cache
        run: ~/godot/godot --headless --path . --editor --quit

      - name: Type-check every GDScript file
        # Runs the same checker as tools/track/check.sh - see the header there for why
        # this is the only real gate on a typing error reaching the browser. Do not
        # inline a `--check-only --script` loop here again: --check-only never starts
        # the SceneTree, so this project's autoloads (Purse, CircuitSession,
        # LoadoutHolder, IncomeRunner) are not registered and every script that
        # references one fails with a bogus "Identifier not found". check.gd runs as a
        # live SceneTree instead. The import pass above populates the class cache it needs.
        run: ~/godot/godot --headless --path . --script res://tools/track/check.gd

      - name: Run the headless test suite
        # Mirrors tools/track/test.sh. The kart's feel model is a RefCounted with no nodes, no
        # Input and no transforms, so the whole suite runs
        # headless in a couple of seconds — which is what makes "a full-lock flick at 12 m/s
        # rotates N degrees in 0.5 s" a test rather than a playtest.
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
